<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06152d">
<title>SKYKING Flight | MattBread Arcade</title>
<style>
:root{color-scheme:dark;--sky:#43d9ff;--gold:#ffd166;--ink:#06152d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#071b3a,#12608a 58%,#f6b65b);font-family:system-ui,Arial,sans-serif;color:#fff;display:grid;place-items:center;padding:18px}
.shell{width:min(900px,100%);text-align:center}.back{display:inline-block;color:#fff;text-decoration:none;margin-bottom:12px;font-weight:700}.brand{font-size:clamp(2rem,7vw,4rem);font-weight:1000;letter-spacing:.06em;text-shadow:0 4px 0 #102c56,0 0 24px #43d9ff;margin:4px 0}.sub{margin:0 0 16px;color:#e2f6ff}
.panel{background:rgba(4,17,42,.78);border:2px solid rgba(120,224,255,.65);border-radius:20px;padding:14px;box-shadow:0 18px 60px #06152d77}
canvas{display:block;width:100%;height:auto;aspect-ratio:800/450;border-radius:12px;background:#6bc8ef;touch-action:manipulation}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:900;cursor:pointer;background:var(--gold);color:#17233b}button.secondary{background:#d9f7ff}.hint{font-size:.9rem;color:#e6f8ff;line-height:1.6}footer{margin-top:14px;font-size:.82rem;color:#f1f8ff}
</style></head>
<body><main class="shell">
<a class="back" href="index.html">← Back to Pack 03</a>
<h1 class="brand">SKYKING</h1><p class="sub">FLIGHT RUN · Keep flying. Beat your best.</p>
<div class="panel"><canvas id="game" width="800" height="450" aria-label="SKYKING Flight game"></canvas>
<div class="controls"><button id="start">START / FLY</button><button class="secondary" id="restart">RESTART</button></div>
<p class="hint">Tap, click, press SPACE, or ↑ to flap. Thread the gaps and don't hit the towers.</p></div>
<footer>MattBread Arcade · A game by Mxtt704</footer></main>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height;
const startBtn=document.getElementById('start'),restartBtn=document.getElementById('restart');
let pilot,pipes,score,best,playing,started,frame,skyOffset,groundOffset;
try{best=Number(localStorage.getItem('skykingFlightBest')||0)}catch(e){best=0}
function reset(){pilot={x:178,y:210,vy:0,r:13};pipes=[];score=0;playing=false;started=false;frame=0;skyOffset=0;groundOffset=0;draw()}
function start(){if(!started){started=true;playing=true;pilot.vy=-5.6;return}if(!playing){reset();started=true;playing=true;pilot.vy=-5.6}}
function flap(){if(!started){start();return}if(playing)pilot.vy=-5.6}
function addPipe(){const gap=178;const top=65+Math.random()*185;pipes.push({x:W+18,top,gap,passed:false})}
function roundedRect(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawBackground(){
const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#65c9f4');g.addColorStop(.72,'#d6f1ff');g.addColorStop(1,'#f8d49a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ffffffb8';for(let i=0;i<5;i++){const x=((i*211-skyOffset*.25)%(W+120)+W+120)%(W+120)-50,y=54+(i%3)*43;ctx.beginPath();ctx.ellipse(x,y,32,11,0,0,Math.PI*2);ctx.ellipse(x+22,y-6,23,14,0,0,Math.PI*2);ctx.ellipse(x+42,y,28,10,0,0,Math.PI*2);ctx.fill()}
ctx.fillStyle='#b9d2d8';ctx.beginPath();ctx.moveTo(0,300);ctx.lineTo(90,225);ctx.lineTo(190,300);ctx.lineTo(315,205);ctx.lineTo(450,305);ctx.lineTo(585,220);ctx.lineTo(735,300);ctx.lineTo(800,250);ctx.lineTo(800,406);ctx.lineTo(0,406);ctx.fill();
ctx.fillStyle='#7eb3a0';ctx.beginPath();ctx.moveTo(0,340);ctx.lineTo(160,285);ctx.lineTo(280,340);ctx.lineTo(420,290);ctx.lineTo(570,345);ctx.lineTo(720,290);ctx.lineTo(800,330);ctx.lineTo(800,410);ctx.lineTo(0,410);ctx.fill()
}
function drawPipes(){
for(const p of pipes){const bottom=p.top+p.gap;const grad=ctx.createLinearGradient(p.x,0,p.x+68,0);grad.addColorStop(0,'#12665a');grad.addColorStop(.25,'#35b98e');grad.addColorStop(.7,'#159477');grad.addColorStop(1,'#064c4b');
ctx.fillStyle=grad;ctx.fillRect(p.x,0,68,p.top-18);ctx.fillRect(p.x-7,p.top-20,82,20);ctx.fillRect(p.x,bottom+18,68,H-bottom-62);ctx.fillRect(p.x-7,bottom,82,20);
ctx.fillStyle='#b2ffe3';ctx.fillRect(p.x+10,0,6,Math.max(0,p.top-20));ctx.fillRect(p.x+10,bottom+20,6,Math.max(0,H-bottom-64));
ctx.fillStyle='#0b514c';ctx.fillRect(p.x+59,0,8,Math.max(0,p.top-20));ctx.fillRect(p.x+59,bottom+20,8,Math.max(0,H-bottom-64));
}}
function drawPilot(){
ctx.save();ctx.translate(pilot.x,pilot.y);ctx.rotate(Math.max(-.35,Math.min(.45,pilot.vy*.045)));
// jacket / torso
ctx.fillStyle='#1c2938';ctx.beginPath();ctx.ellipse(-2,7,18,13,-.12,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#d9e4e8';ctx.beginPath();ctx.moveTo(-6,-1);ctx.lineTo(1,10);ctx.lineTo(7,-1);ctx.lineTo(3,15);ctx.lineTo(-1,15);ctx.closePath();ctx.fill();
// neck and face
roundedRect(-9,-17,17,17,5,'#d6a17d');
ctx.fillStyle='#d6a17d';ctx.beginPath();ctx.ellipse(0,-22,14,16,0,0,Math.PI*2);ctx.fill();
// hair
ctx.fillStyle='#30241f';ctx.beginPath();ctx.arc(0,-27,14,Math.PI,Math.PI*2);ctx.lineTo(14,-20);ctx.lineTo(9,-25);ctx.lineTo(4,-29);ctx.lineTo(-4,-27);ctx.lineTo(-12,-20);ctx.closePath();ctx.fill();
// beard and hairline
ctx.fillStyle='#38251f';ctx.beginPath();ctx.moveTo(-12,-19);ctx.quadraticCurveTo(-10,-6,0,-7);ctx.quadraticCurveTo(11,-7,12,-19);ctx.lineTo(7,-14);ctx.lineTo(-6,-14);ctx.closePath();ctx.fill();
// eyes, brows, smile
ctx.strokeStyle='#35251f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-9,-25);ctx.lineTo(-4,-26);ctx.moveTo(4,-26);ctx.lineTo(9,-25);ctx.stroke();
ctx.fillStyle='#172235';ctx.beginPath();ctx.arc(-5,-22,1.5,0,Math.PI*2);ctx.arc(5,-22,1.5,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#f0c3a1';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-3,-13);ctx.quadraticCurveTo(0,-11,3,-13);ctx.stroke();
// stylized flight trail
ctx.strokeStyle='#ffd166';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-18,8);ctx.lineTo(-27,5);ctx.moveTo(-18,13);ctx.lineTo(-24,15);ctx.stroke();
ctx.restore();
}
function overlay(title,subtitle){ctx.fillStyle='#07182ddd';ctx.fillRect(120,140,560,150);ctx.strokeStyle='#7be4ff';ctx.lineWidth=2;ctx.strokeRect(120,140,560,150);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 34px system-ui';ctx.fillText(title,W/2,190);ctx.font='600 18px system-ui';ctx.fillText(subtitle,W/2,226);ctx.font='700 14px system-ui';ctx.fillStyle='#ffd166';ctx.fillText('SKYKING · FLIGHT CHALLENGE',W/2,260);ctx.textAlign='left'}
function draw(){
drawBackground();drawPipes();
ctx.fillStyle='#4bba6a';ctx.fillRect(0,H-44,W,44);ctx.fillStyle='#277a4d';ctx.fillRect(0,H-44,W,8);
ctx.fillStyle='#d9f99d';for(let x=-(groundOffset%42);x<W;x+=42){ctx.beginPath();ctx.moveTo(x,H-44);ctx.lineTo(x+17,H-44);ctx.lineTo(x+7,H-35);ctx.closePath();ctx.fill()}
drawPilot();ctx.textAlign='left';ctx.fillStyle='#092a49';ctx.font='900 24px system-ui';ctx.fillText('SCORE '+score,20,34);ctx.font='800 15px system-ui';ctx.fillText('BEST '+best,22,58);
if(!started)overlay('SKYKING FLIGHT','Tap START, tap the screen, or press SPACE');
else if(!playing)overlay('FLIGHT OVER','Score: '+score+' · Press RESTART to try again');
}
function end(){if(!playing)return;playing=false;try{if(score>best){best=score;localStorage.setItem('skykingFlightBest',String(best))}}catch(e){}draw()}
function tick(){
if(playing){
frame++;skyOffset+=1.5;groundOffset+=2.2;pilot.vy=Math.min(6.5,pilot.vy+.27);pilot.y+=pilot.vy;
if(frame===1||frame%105===0)addPipe();
for(const p of pipes){
p.x-=2.55;
if(!p.passed&&p.x+68<pilot.x){p.passed=true;score++}
const hitX=pilot.x+pilot.r>p.x-2&&pilot.x-pilot.r<p.x+70;
const hitY=pilot.y-pilot.r<p.top-1||pilot.y+pilot.r>p.top+p.gap+1;
if(hitX&&hitY)end();
}
pipes=pipes.filter(p=>p.x>-100);
if(pilot.y+pilot.r>H-44||pilot.y-pilot.r<0)end();
draw();
}
requestAnimationFrame(tick)
}
startBtn.addEventListener('click',flap);
restartBtn.addEventListener('click',()=>{reset();started=true;playing=true;pilot.vy=-5.6});
c.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});
reset();requestAnimationFrame(tick)
})();
</script></body></html>
