<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>Mini Pack 03 — Play</title>
<style>
:root{color-scheme:dark;--bg:#080b14;--panel:#121a2c;--blue:#38bdf8;--red:#ff416c;--text:#f4f7ff;--muted:#a5b2cc}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:radial-gradient(circle at top,#1b3154,#080b14 65%);color:var(--text);font-family:system-ui,Arial,sans-serif}.wrap{max-width:980px;margin:auto}.back{color:var(--blue);font-weight:800;text-decoration:none}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.hud{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-weight:800}.hud b{color:white}h1{margin:15px 0 5px;font-size:clamp(1.7rem,5vw,3rem)}p{color:var(--muted);line-height:1.5}.panel{background:#101827;border:1px solid #293650;border-radius:16px;padding:12px;box-shadow:0 16px 40px #0005}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#080e1c;border-radius:10px;touch-action:none}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button,.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--red);color:white;font-weight:900;cursor:pointer;text-decoration:none}button.secondary,.btn.secondary{background:#25344e}.help{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.small{font-size:.9rem}.mobile{display:none;gap:8px;margin-top:10px}.mobile button{flex:1;background:#25344e}@media(max-width:650px){body{padding:12px}.mobile{display:flex}.panel{padding:7px}}
</style></head><body><main class="wrap"><div class="top"><a class="back" href="index.html">← Pack 03 games</a><div class="hud"><span>SCORE: <b id="score">0</b></span><span>BEST: <b id="best">0</b></span><span id="status">READY</span></div></div><h1 id="title">Mini Pack 03</h1><p id="desc">An original arcade mini-game.</p><div class="panel"><canvas id="game" width="800" height="450" aria-label="Game area"></canvas><div class="mobile"><button data-key="left">◀ LEFT</button><button data-key="up">▲ JUMP / FIRE</button><button data-key="right">RIGHT ▶</button></div><div class="controls"><button id="start">START / RESTART</button><button id="pause" class="secondary">PAUSE</button><a class="btn secondary" href="index.html">BACK TO PACK 03</a></div></div><p class="help small"><span id="instructions">Use arrow keys or WASD. On mobile, use the buttons or tap.</span><span>MattBread Arcade · Mxtt704</span></p></main>
<script>
(()=>{
const defs={
'cosmic-defender':['🚀 Cosmic Defender','Shoot incoming space rocks. Move with arrows/WASD; press Space or tap to fire.','SHOOT'],
'neon-drift':['🏎️ Neon Drift','Dodge traffic and survive as the road gets faster. Move left/right.','DODGE'],
'brickstorm':['🧱 Brickstorm','Break every brick with the bouncing ball. Move the paddle with arrows or mouse.','BREAK'],
'astro-run':['🛸 Astro Run','Jump over hazards and see how far you can run. Space, Up, or tap to jump.','JUMP'],
'puzzle-pulse':['🧩 Puzzle Pulse','Find matching pairs. Click two tiles to flip them.','MATCH'],
'dragon-trail':['🐉 Dragon Trail','Collect glowing gems and avoid your own trail. Turn with arrows/WASD.','COLLECT'],
'target-rush':['🎯 Target Rush','Click or tap as many targets as possible before the timer runs out.','AIM'],
'galaxy-quest':['🌌 Galaxy Quest','Collect stars and dodge meteors. Move with arrows/WASD.','COLLECT']
};
const id=new URLSearchParams(location.search).get('game')||'cosmic-defender',d=defs[id]||defs['cosmic-defender'];
document.title=d[0]+' | MattBread Arcade';document.getElementById('title').textContent=d[0];document.getElementById('desc').textContent=d[1];
const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status');
const W=800,H=450,keys={},store='mb03-'+id+'-best';let score=0,best=Number(localStorage.getItem(store)||0),running=false,paused=false,frame=0,items=[],particles=[],player={},timer=60,ball={},paddle={},bricks=[],tiles=[],flipped=[],matches=0,trail=[],dir={x:1,y:0},nextTurn={x:1,y:0},target=null,raf=0;
bestEl.textContent=best;
function reset(){score=0;frame=0;timer=id==='target-rush'?30:60;items=[];particles=[];flipped=[];matches=0;trail=[];dir={x:1,y:0};nextTurn={x:1,y:0};player={x:W/2,y:H-75,w:34,h:34,vx:0,vy:0};ball={x:W/2,y:H-130,vx:3.2,vy:-3.3,r:8};paddle={x:W/2-65,y:H-42,w:130,h:13};bricks=[];tiles=[];target=null;
if(id==='brickstorm'){for(let r=0;r<5;r++)for(let col=0;col<10;col++)bricks.push({x:65+col*68,y:55+r*27,w:59,h:17,on:true});}
if(id==='puzzle-pulse'){let vals=['🍞','⭐','🚀','🐉','🍞','⭐','🚀','🐉','💎','🎮','💎','🎮'];vals.sort(()=>Math.random()-.5);tiles=vals.map((v,i)=>({v,x:180+(i%4)*112,y:65+Math.floor(i/4)*105,open:false,done:false}));}
if(id==='dragon-trail'){player={x:400,y:225,w:18,h:18};trail=[{x:400,y:225},{x:382,y:225},{x:364,y:225}];spawnItem('gem');}
if(id==='target-rush')spawnItem('target');
if(id==='astro-run'){for(let i=0;i<3;i++)items.push({type:'hazard',x:W+260+i*360,y:H-85,r:17,w:30,h:30,speed:5});}else if(['cosmic-defender','neon-drift','galaxy-quest'].includes(id))for(let i=0;i<5;i++)spawnItem(id==='cosmic-defender'?'rock':id==='neon-drift'?'car':'meteor');
scoreEl.textContent='0';statusEl.textContent='READY';draw();}
function spawnItem(type){const x=type==='hazard'?W+180+Math.random()*180:45+Math.random()*(W-90);const y=type==='car'?-80:type==='hazard'?H-85:35+Math.random()*150;items.push({type,x,y,r:type==='target'?24:17,w:type==='car'?42:30,h:type==='car'?68:30,speed:type==='hazard'?5:2+Math.random()*2});}
function addScore(n=10){score+=n;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem(store,best);}}
function end(){running=false;statusEl.textContent='GAME OVER';draw();ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='white';ctx.font='bold 42px system-ui';ctx.fillText('GAME OVER',W/2,H/2-12);ctx.font='bold 22px system-ui';ctx.fillText('Score: '+score+'  •  Best: '+best,W/2,H/2+30);ctx.font='16px system-ui';ctx.fillText('Press START / RESTART to play again',W/2,H/2+65);}
function background(){ctx.fillStyle='#080e1c';ctx.fillRect(0,0,W,H);for(let i=0;i<65;i++){let x=(i*127+frame*.12)%W,y=(i*67+frame*.3)%H;ctx.fillStyle=i%3?'#9cbce055':'#38bdf877';ctx.fillRect(x,y,2,2)}}
function text(t,x,y,size=20,color='#f4f7ff'){ctx.fillStyle=color;ctx.font='bold '+size+'px system-ui';ctx.textAlign='center';ctx.fillText(t,x,y)}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle=id==='astro-run'?'#a78bfa':'#38bdf8';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=15;ctx.beginPath();ctx.roundRect(-player.w/2,-player.h/2,player.w,player.h,8);ctx.fill();ctx.shadowBlur=0;text('✦',0,7,22,'#fff');ctx.restore()}
function draw(){background();
if(id==='cosmic-defender'||id==='galaxy-quest'){drawPlayer();items.forEach(o=>{ctx.fillStyle=o.type==='rock'?'#ff9f43':o.type==='star'?'#ffe66d':'#ff416c';ctx.beginPath();ctx.arc(o.x,o.y,o.r||17,0,Math.PI*2);ctx.fill();text(o.type==='star'?'★':o.type==='rock'?'●':'☄',o.x,o.y+6,19,'#fff')});if(id==='cosmic-defender')items.filter(o=>o.type==='bullet').forEach(o=>{ctx.fillStyle='#7dd3fc';ctx.fillRect(o.x-3,o.y-10,6,16)});}
if(id==='neon-drift'){ctx.fillStyle='#18263c';ctx.fillRect(190,0,420,H);ctx.strokeStyle='#dbeafe';ctx.setLineDash([22,20]);ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(400,0);ctx.lineTo(400,H);ctx.stroke();ctx.setLineDash([]);drawPlayer();items.forEach(o=>{ctx.fillStyle='#ff416c';ctx.fillRect(o.x-o.w/2,o.y,o.w,o.h);text('🚗',o.x,o.y+42,28)});}
if(id==='astro-run'){ctx.fillStyle='#172f2b';ctx.fillRect(0,H-55,W,55);drawPlayer();items.forEach(o=>{ctx.fillStyle='#ff416c';ctx.fillRect(o.x-o.w/2,o.y,o.w,o.h)});text('DISTANCE '+score,W/2,35,18,'#a7f3d0');}
if(id==='brickstorm'){bricks.forEach((b,i)=>{if(!b.on)return;ctx.fillStyle=['#ff416c','#fb923c','#facc15','#4ade80','#38bdf8'][Math.floor(i/10)];ctx.fillRect(b.x,b.y,b.w,b.h)});ctx.fillStyle='#f4f7ff';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();text('BRICKS LEFT: '+bricks.filter(b=>b.on).length,W/2,28,18);}
if(id==='puzzle-pulse'){tiles.forEach((t,i)=>{ctx.fillStyle=t.done?'#166534':t.open?'#1e4260':'#25344e';ctx.beginPath();ctx.roundRect(t.x,t.y,88,78,12);ctx.fill();ctx.strokeStyle='#38bdf8';ctx.stroke();text(t.open||t.done?t.v:'?',t.x+44,t.y+49,30)});text('MATCHED '+matches+' / 6',W/2,35,18);}
if(id==='dragon-trail'){trail.forEach((p,i)=>{ctx.fillStyle=i?'#4ade80':'#bbf7d0';ctx.fillRect(p.x-8,p.y-8,16,16)});items.forEach(o=>text('💎',o.x,o.y+8,24));}
if(id==='target-rush'){items.forEach(o=>{ctx.fillStyle='#ff416c';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.x,o.y,o.r*.58,0,Math.PI*2);ctx.fill();ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(o.x,o.y,o.r*.24,0,Math.PI*2);ctx.fill()});text('TIME '+Math.max(0,Math.ceil(timer)),W/2,35,24);}
}
function hit(a,b){return Math.abs(a.x-b.x)<(a.w||a.r||10)/2+(b.w||b.r||10)/2&&Math.abs(a.y-b.y)<(a.h||a.r||10)/2+(b.h||b.r||10)/2}
function tick(){if(!running||paused)return;frame++;timer-=1/60;
if(id==='cosmic-defender'){player.x+=((keys.ArrowRight||keys.d)?5:0)-((keys.ArrowLeft||keys.a)?5:0);player.x=Math.max(20,Math.min(W-20,player.x));items.forEach(o=>{o.y+=o.type==='bullet'?-7:o.speed;if(o.type==='rock'&&hit(player,o))end();if(o.type==='bullet')items.filter(r=>r.type==='rock'&&Math.hypot(r.x-o.x,r.y-o.y)<22).forEach(r=>{r.y=H+100;o.y=-100;addScore(10)});});items=items.filter(o=>o.y>-40&&o.y<H+50);if(frame%70===0)spawnItem('rock');}
if(id==='galaxy-quest'){player.x+=((keys.ArrowRight||keys.d)?4:0)-((keys.ArrowLeft||keys.a)?4:0);player.y+=((keys.ArrowDown||keys.s)?4:0)-((keys.ArrowUp||keys.w)?4:0);player.x=Math.max(20,Math.min(W-20,player.x));player.y=Math.max(20,Math.min(H-20,player.y));items.forEach(o=>{o.y+=o.speed;if(hit(player,o)){if(o.type==='star'){addScore(10);o.y=H+100}else end()}});items=items.filter(o=>o.y<H+40);if(frame%60===0)spawnItem(Math.random()<.55?'star':'meteor');}
if(id==='neon-drift'){player.x+=((keys.ArrowRight||keys.d)?6:0)-((keys.ArrowLeft||keys.a)?6:0);player.x=Math.max(215,Math.min(585,player.x));items.forEach(o=>{o.y+=o.speed+1;if(hit(player,{...o,y:o.y+o.h/2})&&o.y<H-35)end();if(o.y>H+10){o.y=-80;o.x=240+Math.random()*320;addScore(1)}});}
if(id==='astro-run'){if((keys.ArrowUp||keys[' ']||keys.w)&&player.y>=H-75)player.vy=-11;player.vy+=.48;player.y+=player.vy;if(player.y>H-75){player.y=H-75;player.vy=0}items.forEach(o=>{o.x-=5;if(hit(player,{...o,y:o.y+o.h/2})&&o.x>0)end();if(o.x<-30){o.x=W+Math.random()*180;addScore(1)}});if(frame%150===0)spawnItem('hazard');}
if(id==='brickstorm'){ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<ball.r||ball.x>W-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy*=-1;if(ball.y>H+20)end();if(ball.y+ball.r>=paddle.y&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w&&ball.vy>0){ball.vy=-Math.abs(ball.vy);ball.vx+=(ball.x-(paddle.x+paddle.w/2))*.035}bricks.forEach(b=>{if(b.on&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.on=false;ball.vy*=-1;addScore(10)}});if(!bricks.some(b=>b.on)){addScore(100);end()}paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x+((keys.ArrowRight||keys.d)?7:0)-((keys.ArrowLeft||keys.a)?7:0)));}
if(id==='dragon-trail'){if(frame%8===0){if(keys.ArrowUp||keys.w)nextTurn={x:0,y:-1};if(keys.ArrowDown||keys.s)nextTurn={x:0,y:1};if(keys.ArrowLeft||keys.a)nextTurn={x:-1,y:0};if(keys.ArrowRight||keys.d)nextTurn={x:1,y:0};dir=nextTurn;const head={x:trail[0].x+dir.x*18,y:trail[0].y+dir.y*18};if(head.x<0||head.x>W||head.y<0||head.y>H||trail.some(p=>Math.hypot(p.x-head.x,p.y-head.y)<8)){end();return}trail.unshift(head);if(items.length&&Math.hypot(head.x-items[0].x,head.y-items[0].y)<20){trail.push({...trail[trail.length-1]});items=[];addScore(10);spawnItem('gem')}else trail.pop();}}
if(id==='target-rush'){if(items.length===0&&frame%20===0)spawnItem('target');if(timer<=0){end();return}}
if(timer<=0&&id!=='target-rush'){timer=60}
if(running){draw();raf=requestAnimationFrame(tick)}}
function start(){cancelAnimationFrame(raf);reset();running=true;paused=false;statusEl.textContent='PLAYING';tick()}
function fire(x,y){if(!running){start();return}if(id==='cosmic-defender'){items.push({type:'bullet',x:player.x,y:player.y-25,r:4});return}if(id==='target-rush'){const i=items.findIndex(o=>Math.hypot(o.x-x,o.y-y)<o.r+8);if(i>=0){items.splice(i,1);addScore(10);spawnItem('target')}return}if(id==='puzzle-pulse'){const t=tiles.find(t=>x>=t.x&&x<=t.x+88&&y>=t.y&&y<=t.y+78&&!t.done&&!t.open);if(!t||flipped.length>=2)return;t.open=true;flipped.push(t);if(flipped.length===2){if(flipped[0].v===flipped[1].v){flipped.forEach(q=>q.done=true);matches++;addScore(20);flipped=[];if(matches===6){addScore(50);end()}}else setTimeout(()=>{flipped.forEach(q=>q.open=false);flipped=[];draw()},650)}draw();return}if(id==='astro-run'){if(player.y>=H-75)player.vy=-11;return}if(id==='brickstorm'){paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));return}if(id==='dragon-trail'){if(Math.abs(x-player.x)>Math.abs(y-player.y))nextTurn={x:x>player.x?1:-1,y:0};else nextTurn={x:0,y:y>player.y?1:-1};return}if(id==='galaxy-quest'||id==='neon-drift'){player.x=x;if(id==='galaxy-quest')player.y=y}}
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;fire(x,y)});
window.addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key===' '&&id==='cosmic-defender'&&running)fire(player.x,player.y);if(e.key==='Enter'&&!running)start()});
window.addEventListener('keyup',e=>keys[e.key]=false);
document.getElementById('start').onclick=start;document.getElementById('pause').onclick=()=>{if(!running)return;paused=!paused;statusEl.textContent=paused?'PAUSED':'PLAYING';if(!paused)tick();else draw()};
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key,map={left:'ArrowLeft',right:'ArrowRight',up:id==='astro-run'?'ArrowUp':id==='cosmic-defender'?' ':'ArrowUp'};b.addEventListener('pointerdown',e=>{e.preventDefault();keys[map[k]]=true;if(k==='up'&&id==='cosmic-defender')fire(player.x,player.y)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[map[k]]=false))});
if(id==='brickstorm')c.addEventListener('pointermove',e=>{if(e.buttons){const r=c.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-r.left)*W/r.width-paddle.w/2))}});
reset();
})();
</script></body></html>
