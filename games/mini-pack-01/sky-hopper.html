<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#36aaff"><title>Sky Hopper | MattBread Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:radial-gradient(circle at top,#203963,#080d19 76%);font-family:system-ui,Arial,sans-serif;color:#fff;text-align:center}.wrap{width:min(720px,100%);margin:auto}.back{display:inline-block;color:#9deaff;text-decoration:none;font-weight:800;margin:5px 0 10px}.brand{font-size:12px;letter-spacing:4px;color:#9deaff;font-weight:900}h1{margin:5px 0;color:#ffe15b;font-size:clamp(2rem,7vw,3.2rem);text-shadow:2px 3px #e45a35}p{color:#d0e0f8}.hud{display:flex;justify-content:center;gap:12px;margin:10px}.stat{background:#111b35;border:1px solid #3c5482;border-radius:12px;padding:8px 20px;color:#a9dcff;font-size:12px;font-weight:900}.stat strong{display:block;font-size:24px;color:#ffe76d}canvas{display:block;width:100%;height:auto;aspect-ratio:480/620;border:4px solid #64ddff;border-radius:15px;background:#62c7ff;touch-action:manipulation;box-shadow:0 15px 45px #0008}.controls{display:flex;justify-content:center;gap:12px;margin:12px 0}.controls button{border:0;border-radius:11px;padding:12px 22px;font-weight:900;color:#11152e;background:linear-gradient(120deg,#ffe66d,#ff9e67);cursor:pointer}.hint{font-size:13px;line-height:1.5}
</style></head><body><main class="wrap"><a class="back" href="../../index.html">← Back to MattBread Arcade</a><div class="brand">MATTBREAD ARCADE</div><h1>SKY HOPPER</h1><p>Flap through the gaps! Dodge the pipes and beat your best score.</p>
<div class="hud"><div class="stat">SCORE<strong id="score">0</strong></div><div class="stat">BEST<strong id="best">0</strong></div></div>
<canvas id="game" width="480" height="620" aria-label="Flappy Bird inspired Sky Hopper game"></canvas>
<div class="controls"><button id="start">START GAME</button><button id="restart">RESTART</button></div>
<p class="hint">Press SPACE or ↑, click, or tap to flap. Works on desktop and mobile.</p></main>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height,$=id=>document.getElementById(id);const key='mbaSkyHopperFlappyBest';let best=0;try{best=+(localStorage.getItem(key)||0)}catch(e){}$('best').textContent=best;
let bird,pipes,score,frame,playing,ready,raf,ground,clouds;
function reset(){bird={x:132,y:270,vy:0,r:16,rot:0};pipes=[];score=0;frame=0;playing=false;ready=true;ground=0;clouds=0;$('score').textContent=0;$('start').textContent='START GAME';draw();overlay('SKY HOPPER','Tap, click, or press SPACE to flap')}
function start(){cancelAnimationFrame(raf);reset();playing=true;ready=false;bird.vy=-5.1;$('start').textContent='FLAP!';raf=requestAnimationFrame(loop)}
function flap(){if(!playing){start();return}bird.vy=-5.25}
function addPipe(){const gap=178,top=65+Math.random()*270;pipes.push({x:W+15,top,gap,passed:false})}
function cloud(x,y,s){ctx.fillStyle='#ffffffd9';ctx.beginPath();ctx.arc(x,y,17*s,0,Math.PI*2);ctx.arc(x+20*s,y-9*s,21*s,0,Math.PI*2);ctx.arc(x+43*s,y,16*s,0,Math.PI*2);ctx.fill()}
function background(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2da7ff');g.addColorStop(.68,'#91e8ff');g.addColorStop(1,'#e2fbff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<5;i++){let x=((i*143-clouds*.35)%(W+130)+W+130)%(W+130)-60;cloud(x,75+(i%3)*86,.65+(i%2)*.22)}}
function drawPipes(){for(const p of pipes){let bottom=p.top+p.gap,g=ctx.createLinearGradient(p.x,0,p.x+62,0);g.addColorStop(0,'#137a3e');g.addColorStop(.32,'#4de05b');g.addColorStop(.7,'#20b747');g.addColorStop(1,'#116332');ctx.fillStyle=g;ctx.fillRect(p.x,0,62,p.top);ctx.fillRect(p.x,bottom,62,H-bottom-54);ctx.fillStyle='#62f36d';ctx.fillRect(p.x-6,p.top-22,74,22);ctx.fillRect(p.x-6,bottom,74,22);ctx.fillStyle='#0b7136';ctx.fillRect(p.x+8,0,5,p.top-22);ctx.fillRect(p.x+8,bottom+22,5,H-bottom-76)}}
function drawGround(){let y=H-54;ctx.fillStyle='#d5a14c';ctx.fillRect(0,y,W,54);ctx.fillStyle='#80502d';ctx.fillRect(0,y+19,W,35);ctx.fillStyle='#54d34e';ctx.fillRect(0,y,W,15);ctx.fillStyle='#b4ff6c';for(let x=-(ground%32);x<W;x+=32)ctx.fillRect(x,y+2,17,4);ctx.fillStyle='#f9d68a';for(let x=-(ground%28);x<W;x+=28)ctx.fillRect(x,y+24,13,5)}
function drawBird(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-.45,Math.min(.9,bird.rot)));ctx.fillStyle='#f8c936';ctx.strokeStyle='#a65b1c';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,18,15,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#f29b30';ctx.beginPath();ctx.ellipse(-5,5,9,6,Math.sin(frame*.3)*.5,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(8,-6,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17233c';ctx.beginPath();ctx.arc(10,-6,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff7a24';ctx.beginPath();ctx.moveTo(14,1);ctx.lineTo(29,5);ctx.lineTo(14,9);ctx.closePath();ctx.fill();ctx.restore()}
function overlay(a,b){ctx.fillStyle='#05142d66';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 31px Arial';ctx.shadowColor='#16335c';ctx.shadowBlur=5;ctx.fillText(a,W/2,H*.43);ctx.shadowBlur=0;ctx.font='bold 16px Arial';ctx.fillText(b,W/2,H*.43+31)}
function draw(){background();drawPipes();drawGround();drawBird();ctx.textAlign='center';ctx.font='900 42px Arial';ctx.lineWidth=4;ctx.strokeStyle='#1c542e';ctx.strokeText(String(score),W/2,58);ctx.fillStyle='#fff';ctx.fillText(String(score),W/2,58);if(!playing)overlay(ready?'SKY HOPPER':'GAME OVER',ready?'Tap, click, or press SPACE to flap':'Score '+score+' · Tap to try again')}
function finish(){playing=false;ready=false;$('start').textContent='PLAY AGAIN';if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem(key,String(best))}catch(e){}}draw();overlay('GAME OVER','Score '+score+' · Tap or press SPACE to retry')}
function loop(){if(!playing)return;frame++;bird.vy+=.27;bird.y+=bird.vy;bird.rot=Math.min(1,bird.vy*.08);clouds+=.45;ground+=3.3;if(frame%92===1)addPipe();for(const p of pipes){p.x-=3.3;if(!p.passed&&p.x+62<bird.x){p.passed=true;score++;$('score').textContent=score;if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem(key,String(best))}catch(e){}}}if(bird.x+bird.r>p.x-4&&bird.x-bird.r<p.x+68&&(bird.y-bird.r<p.top||bird.y+bird.r>p.top+p.gap)){finish();return}}pipes=pipes.filter(p=>p.x>-90);if(bird.y-bird.r<0||bird.y+bird.r>H-54){finish();return}draw();raf=requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{e.preventDefault();flap()});$('start').addEventListener('click',flap);$('restart').addEventListener('click',start);window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(!e.repeat)flap()}});reset();
})();
</script></body></html>
