<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11152e"><title>Sky Hopper | MattBread Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#293c70,#090d1b 75%);font-family:system-ui,Arial,sans-serif;color:#fff;text-align:center}.wrap{width:min(650px,100%);margin:auto}.back{display:inline-block;color:#7ee7ff;text-decoration:none;font-weight:800;margin:6px 0 12px}.brand{font-size:12px;letter-spacing:4px;color:#7ee7ff;font-weight:900}h1{margin:5px 0;color:#f9e56d;font-size:clamp(2rem,7vw,3.2rem)}p{color:#c5d4f3}.hud{display:flex;justify-content:center;gap:12px;margin:12px}.stat{background:#111b35;border:1px solid #3c5482;border-radius:12px;padding:8px 20px;color:#a9dcff;font-size:12px;font-weight:900}.stat strong{display:block;font-size:24px;color:#ffe76d}canvas{display:block;width:100%;height:auto;aspect-ratio:480/620;border:3px solid #8ce8ff;border-radius:16px;background:#18254b;touch-action:none;box-shadow:0 15px 45px #0008}.controls{display:flex;justify-content:center;gap:12px;margin:12px 0}.controls button,.touch button{border:0;border-radius:12px;padding:12px 22px;font-weight:900;color:#11152e;background:linear-gradient(120deg,#ffe66d,#ff9e67);cursor:pointer}.touch{display:flex;gap:12px;justify-content:center}.touch button{background:#243c69;color:white;min-width:100px;touch-action:none}.hint{font-size:13px;line-height:1.5}@media(min-width:700px){.touch{display:none}} 
</style></head><body><main class="wrap"><a class="back" href="../../index.html">← Back to MattBread Arcade</a><div class="brand">MATTBREAD ARCADE</div><h1>SKY HOPPER</h1><p>Keep bouncing upward! Land on platforms, grab stars, and don't fall.</p>
<div class="hud"><div class="stat">HEIGHT<strong id="score">0</strong></div><div class="stat">BEST<strong id="best">0</strong></div></div>
<canvas id="game" width="480" height="620" aria-label="Sky Hopper vertical platform jumping game"></canvas>
<div class="controls"><button id="start">START CLIMBING</button><button id="restart">RESTART</button></div><div class="touch"><button id="left">◀ LEFT</button><button id="right">RIGHT ▶</button></div>
<p class="hint">Move with ← → or A / D. On mobile, hold the left and right buttons. Bounce automatically and reach a new height!</p></main>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height,$=id=>document.getElementById(id);let best=0;try{best=+(localStorage.getItem('skyHopperBounceBest')||0)}catch(e){}$('best').textContent=best;
let player,platforms,stars,score,camera,playing,started,keys={},raf=0;
function reset(){player={x:W/2,y:H-110,vx:0,vy:-10,r:16};platforms=[];stars=[];score=0;camera=0;playing=false;started=false;for(let i=0;i<9;i++)platforms.push({x:20+Math.random()*(W-100),y:H-35-i*68,w:75+Math.random()*24,kind:i%5===0?'spring':'normal'});stars.push({x:W*.68,y:H-320});$('score').textContent='0';draw();overlay('SKY HOPPER','Bounce from platform to platform!')}
function start(){if(playing)return;reset();playing=true;started=true;player.vy=-10;raf=requestAnimationFrame(loop)}
function overlay(a,b){ctx.fillStyle='#080d20b8';ctx.fillRect(35,235,W-70,125);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 28px system-ui';ctx.fillText(a,W/2,280);ctx.font='600 15px system-ui';ctx.fillText(b,W/2,315);ctx.fillStyle='#ffe66d';ctx.font='bold 13px system-ui';ctx.fillText('MATTBREAD ARCADE',W/2,340)}
function draw(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#15234a');g.addColorStop(1,'#4c4b91');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<65;i++){ctx.fillStyle=i%4?'#d9edff88':'#ffe66d';ctx.fillRect((i*83)%W,(i*137+camera*.25)%H,2,2)}
platforms.forEach(p=>{ctx.fillStyle=p.kind==='spring'?'#ffb85c':'#60e7b1';ctx.beginPath();ctx.roundRect(p.x,p.y-camera,p.w,12,6);ctx.fill();ctx.fillStyle='#ffffff55';ctx.fillRect(p.x+7,p.y-camera+2,p.w-14,2)});
stars.forEach(s=>{ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(s.x,s.y-camera,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff4b0';ctx.fillRect(s.x-2,s.y-camera-12,4,24)});
ctx.save();ctx.translate(player.x,player.y-camera);ctx.fillStyle='#ff78c8';ctx.shadowColor='#ff78c8';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5,-4,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#18254b';ctx.beginPath();ctx.arc(7,-4,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.moveTo(-10,8);ctx.lineTo(-20,15);ctx.lineTo(-7,14);ctx.fill();ctx.restore();ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.fillText('HEIGHT '+score,14,28);if(!playing)overlay(started?'FALLEN!':'READY TO CLIMB',started?'Press RESTART to try again':'Press START or move left/right')}
function end(){playing=false;started=true;if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('skyHopperBounceBest',String(best))}catch(e){}}draw();overlay('RUN OVER','Height '+score+' · Press RESTART')}
function loop(){if(!playing)return;player.vx=((keys.right?1:0)-(keys.left?1:0))*4.6;player.x+=player.vx;if(player.x<-player.r)player.x=W+player.r;if(player.x>W+player.r)player.x=-player.r;let oldY=player.y;player.vy+=.28;player.y+=player.vy;
if(player.vy>0)for(const p of platforms){let py=p.y-camera;if(oldY+player.r<=py+5&&player.y+player.r>=py&&player.x>p.x-8&&player.x<p.x+p.w+8){player.vy=p.kind==='spring'?-15:-10.5;}}
for(let i=stars.length-1;i>=0;i--){let s=stars[i];if(Math.hypot(player.x-s.x,player.y-s.y)<player.r+12){stars.splice(i,1);score+=50;}}
if(player.y-camera<H*.42){let shift=H*.42-(player.y-camera);camera+=shift;score=Math.max(score,Math.floor(camera/10));while(platforms.length&&Math.min(...platforms.map(p=>p.y))>camera-80){let y=Math.min(...platforms.map(p=>p.y))-65-Math.random()*28;platforms.push({x:10+Math.random()*(W-100),y,w:65+Math.random()*35,kind:Math.random()<.12?'spring':'normal'});}platforms=platforms.filter(p=>p.y-camera<H+30);if(stars.length<2&&Math.random()<.025)stars.push({x:25+Math.random()*(W-50),y:camera+Math.random()*H*.6});}
$('score').textContent=score;if(player.y-camera>H+45){end();return}draw();raf=requestAnimationFrame(loop)}
function set(k,v){keys[k]=v}['pointerdown','touchstart'].forEach(ev=>{$('left').addEventListener(ev,e=>{e.preventDefault();set('left',true)});$('right').addEventListener(ev,e=>{e.preventDefault();set('right',true)})});['pointerup','pointerleave','pointercancel','touchend'].forEach(ev=>{$('left').addEventListener(ev,()=>set('left',false));$('right').addEventListener(ev,()=>set('right',false))});window.addEventListener('keydown',e=>{if(['ArrowLeft','KeyA'].includes(e.code)){e.preventDefault();set('left',true)}if(['ArrowRight','KeyD'].includes(e.code)){e.preventDefault();set('right',true)}});window.addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))set('left',false);if(['ArrowRight','KeyD'].includes(e.code))set('right',false)});$('start').onclick=start;$('restart').onclick=start;reset()})();
</script></body></html>
