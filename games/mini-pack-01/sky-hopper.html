<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#37b9f5">
<title>Sky Hopper | MattBread Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:radial-gradient(circle at top,#1c3154,#080b14 72%);font-family:Arial,Helvetica,sans-serif;color:#f7fbff;text-align:center}.wrap{width:min(760px,100%);margin:auto}.back{display:inline-block;color:#38bdf8;text-decoration:none;font-weight:800;margin:4px 0 15px}.brand{color:#38bdf8;letter-spacing:3px;font-size:12px;font-weight:900}h1{font-size:clamp(2.2rem,8vw,3.5rem);margin:7px 0;color:#ffe15a;text-shadow:3px 4px #e94e35}p{color:#b7c8e8;line-height:1.5}.hud{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}.stat{min-width:95px;background:#101a32;border:1px solid #28496d;border-radius:11px;padding:9px 14px;color:#9bdcff;font-size:12px;font-weight:800;letter-spacing:1px}.stat strong{display:block;color:#ffe15a;font-size:24px;margin-top:4px}canvas{width:100%;height:auto;display:block;aspect-ratio:480/620;border:4px solid #4dd8ff;border-radius:15px;background:#63caff;touch-action:manipulation;box-shadow:0 12px 35px #0006}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:13px}button{border:0;border-radius:11px;padding:12px 20px;background:linear-gradient(100deg,#00bfff,#625cff);color:white;font-size:15px;font-weight:900;cursor:pointer}button:active{transform:scale(.97)}.hint{font-size:13px;margin-top:14px}@media(max-width:520px){body{padding:10px}.stat{min-width:82px;padding:8px}.stat strong{font-size:20px}button{padding:12px 15px}}
</style>
</head>
<body><main class="wrap">
<a class="back" href="../../index.html">← Back to MattBread Arcade</a>
<div class="brand">MATTBREAD ARCADE</div><h1>SKY HOPPER</h1><p>Flap through the pipes. Don't hit anything. Beat your best score!</p>
<div class="hud"><div class="stat">SCORE<strong id="score">0</strong></div><div class="stat">BEST<strong id="best">0</strong></div></div>
<canvas id="game" width="480" height="620" aria-label="Sky Hopper Flappy Bird-style game"></canvas>
<div class="controls"><button id="start">START GAME</button><button id="restart">RESTART</button></div>
<p class="hint">Controls: SPACE, ↑, click, or tap to flap. Works on mobile and desktop.</p>
</main>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height;
const $=id=>document.getElementById(id);
const store='mbaSkyHopperFlappyBest';let best=0;try{best=Number(localStorage.getItem(store)||0)}catch(e){}
$('best').textContent=best;
let bird,pipes,score,frame,playing,ready,raf,groundShift,skyShift;
function reset(){bird={x:128,y:270,vy:0,r:16,rot:0};pipes=[];score=0;frame=0;playing=false;ready=true;groundShift=0;skyShift=0;$('score').textContent='0';$('start').textContent='START GAME';draw();overlay('SKY HOPPER','Tap, click, or press SPACE to flap');}
function start(){cancelAnimationFrame(raf);reset();playing=true;ready=false;bird.vy=-5.2;$('start').textContent='FLAP!';raf=requestAnimationFrame(loop)}
function flap(){if(!playing){start();return}bird.vy=-5.3}
function addPipe(){const gap=174,top=70+Math.random()*255;pipes.push({x:W+12,top,gap,passed:false})}
function cloud(x,y,s){ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(x,y,17*s,0,Math.PI*2);ctx.arc(x+19*s,y-9*s,21*s,0,Math.PI*2);ctx.arc(x+43*s,y,16*s,0,Math.PI*2);ctx.fill()}
function background(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#36a9ff');g.addColorStop(.68,'#8de6ff');g.addColorStop(1,'#e0fbff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<5;i++){let x=((i*143-skyShift*.35)%(W+130)+W+130)%(W+130)-60;cloud(x,75+(i%3)*85,.65+(i%2)*.22)}}
function drawPipes(){for(const p of pipes){const bottom=p.top+p.gap;const grad=ctx.createLinearGradient(p.x,0,p.x+62,0);grad.addColorStop(0,'#168447');grad.addColorStop(.35,'#4fe05e');grad.addColorStop(.72,'#25b747');grad.addColorStop(1,'#116b38');ctx.fillStyle=grad;ctx.fillRect(p.x,0,62,p.top);ctx.fillRect(p.x,bottom,62,H-bottom-54);ctx.fillStyle='#55ed67';ctx.fillRect(p.x-6,p.top-22,74,22);ctx.fillRect(p.x-6,bottom,74,22);ctx.fillStyle='#0b7136';ctx.fillRect(p.x+7,0,5,p.top-22);ctx.fillRect(p.x+7,bottom+22,5,H-bottom-76);}}
function drawGround(){const y=H-54;ctx.fillStyle='#d6a34d';ctx.fillRect(0,y,W,54);ctx.fillStyle='#7b4b2c';ctx.fillRect(0,y+18,W,36);ctx.fillStyle='#56d34f';ctx.fillRect(0,y,W,15);ctx.fillStyle='#b2ff68';for(let x=-(groundShift%32);x<W;x+=32)ctx.fillRect(x,y+2,17,4);ctx.fillStyle='#f8d78a';for(let x=-(groundShift%28);x<W;x+=28)ctx.fillRect(x,y+23,13,5)}
function drawBird(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-.45,Math.min(.9,bird.rot)));ctx.fillStyle='#f8c936';ctx.strokeStyle='#a65b1c';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,18,15,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#f29b30';ctx.beginPath();ctx.ellipse(-5,5,9,6,Math.sin(frame*.3)*.5,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(8,-6,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17233c';ctx.beginPath();ctx.arc(10,-6,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff7a24';ctx.beginPath();ctx.moveTo(14,1);ctx.lineTo(29,5);ctx.lineTo(14,9);ctx.closePath();ctx.fill();ctx.restore()}
function overlay(title,sub){ctx.fillStyle='rgba(5,20,45,.38)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 31px Arial';ctx.shadowColor='#16335c';ctx.shadowBlur=5;ctx.fillText(title,W/2,H*.43);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.fillText(sub,W/2,H*.43+31)}
function draw(){background();drawPipes();drawGround();drawBird();ctx.textAlign='center';ctx.font='900 42px Arial';ctx.lineWidth=4;ctx.strokeStyle='#1c542e';ctx.strokeText(String(score),W/2,58);ctx.fillStyle='#fff';ctx.fillText(String(score),W/2,58);if(!playing)overlay(ready?'SKY HOPPER':'GAME OVER',ready?'Tap, click, or press SPACE to flap':'Score '+score+' · Tap to try again')}
function finish(){playing=false;ready=false;$('start').textContent='PLAY AGAIN';if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem(store,String(best))}catch(e){}}draw();overlay('GAME OVER','Score '+score+' · Tap or press SPACE to retry')}
function loop(){if(!playing)return;frame++;bird.vy+=.27;bird.y+=bird.vy;bird.rot=Math.min(1,bird.vy*.08);skyShift+=.45;groundShift+=3.3;if(frame%92===1)addPipe();for(const p of pipes){p.x-=3.3;if(!p.passed&&p.x+62<bird.x){p.passed=true;score++;$('score').textContent=score;if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem(store,String(best))}catch(e){}}}if(bird.x+bird.r>p.x-4&&bird.x-bird.r<p.x+68&&(bird.y-bird.r<p.top||bird.y+bird.r>p.top+p.gap)){finish();return}}pipes=pipes.filter(p=>p.x>-90);if(bird.y-bird.r<0||bird.y+bird.r>H-54){finish();return}draw();raf=requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{e.preventDefault();flap()});$('start').addEventListener('click',flap);$('restart').addEventListener('click',start);window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(!e.repeat)flap()}});reset();
})();
</script></body></html>
