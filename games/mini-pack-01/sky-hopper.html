<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#36aaff"><title>Sky Hopper | MattBread Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:radial-gradient(circle at top,#203963,#080d19 76%);font-family:system-ui,Arial,sans-serif;color:#fff;text-align:center}.wrap{width:min(720px,100%);margin:auto}.back{display:inline-block;color:#9deaff;text-decoration:none;font-weight:800;margin:5px 0 10px}.brand{font-size:12px;letter-spacing:4px;color:#9deaff;font-weight:900}h1{margin:5px 0;color:#ffe15b;font-size:clamp(2rem,7vw,3.2rem);text-shadow:2px 3px #e45a35}p{color:#d0e0f8}.hud{display:flex;justify-content:center;gap:12px;margin:10px}.stat{background:#111b35;border:1px solid #3c5482;border-radius:12px;padding:8px 20px;color:#a9dcff;font-size:12px;font-weight:900}.stat strong{display:block;font-size:24px;color:#ffe76d}canvas{display:block;width:auto;height:min(620px,calc(100vh - 330px));max-width:100%;aspect-ratio:480/620;margin:0 auto;border:4px solid #64ddff;border-radius:15px;background:#62c7ff;touch-action:manipulation;box-shadow:0 15px 45px #0008}.controls{display:flex;justify-content:center;gap:12px;margin:12px 0}.controls button{border:0;border-radius:11px;padding:12px 22px;font-weight:900;color:#11152e;background:linear-gradient(120deg,#ffe66d,#ff9e67);cursor:pointer}.hint{font-size:13px;line-height:1.5}
@media(max-height:700px){body{padding:6px}.back{margin:1px 0 4px}.brand{font-size:10px}h1{font-size:2rem;margin:1px 0}p{margin:5px 0}.hud{margin:5px;gap:8px}.stat{padding:5px 16px}.stat strong{font-size:20px}canvas{height:min(620px,calc(100vh - 270px))}.controls{margin:6px 0}.controls button{padding:9px 18px}.hint{font-size:11px;margin:4px 0}}
</style></head><body><main class="wrap"><a class="back" href="../../index.html">← Back to MattBread Arcade</a><div class="brand">MATTBREAD ARCADE</div><h1>SKY HOPPER</h1><p>Flap through the gaps! Dodge the pipes and beat your best score.</p>
<div class="hud"><div class="stat">SCORE<strong id="score">0</strong></div><div class="stat">BEST<strong id="best">0</strong></div></div>
<canvas id="game" width="480" height="620" aria-label="Flappy Bird inspired Sky Hopper game"></canvas>
<div class="controls"><button id="start">START GAME</button><button id="restart">RESTART</button></div>
<p class="hint">Press SPACE or ↑, click, or tap to flap. Works on desktop and mobile.</p></main>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height,$=id=>document.getElementById(id);const key='mbaSkyHopperFlappyBest';let best=0;try{best=+(localStorage.getItem(key)||0)}catch(e){}$('best').textContent=best;
let bird,pipes,score,frame,playing,ready,raf,ground,clouds,backgroundMode,modeElapsed;
function reset(){bird={x:132,y:270,vy:0,r:16,rot:0};pipes=[];score=0;frame=0;playing=false;ready=true;ground=0;clouds=0;backgroundMode=0;modeElapsed=0;$('score').textContent=0;$('start').textContent='START GAME';draw();overlay('SKY HOPPER','Tap, click, or press SPACE to flap')}
function start(){cancelAnimationFrame(raf);reset();playing=true;ready=false;bird.vy=-5.1;$('start').textContent='FLAP!';raf=requestAnimationFrame(loop)}
function flap(){if(!playing){start();return}bird.vy=-5.25}
function addPipe(){const gap=148,top=48+Math.random()*300;pipes.push({x:W+15,top,gap,passed:false})}
function cloud(x,y,s){ctx.fillStyle='#ffffffd9';ctx.beginPath();ctx.arc(x,y,17*s,0,Math.PI*2);ctx.arc(x+20*s,y-9*s,21*s,0,Math.PI*2);ctx.arc(x+43*s,y,16*s,0,Math.PI*2);ctx.fill()}
function background(){const palettes=[{sky:'#2da7ff',mid:'#91e8ff',low:'#e2fbff',far:'#8ccf83',near:'#4ba85a'},{sky:'#f68f73',mid:'#ffc58a',low:'#ffe9b4',far:'#b99bcb',near:'#6e7eb8'}];const pal=palettes[backgroundMode];let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,pal.sky);g.addColorStop(.68,pal.mid);g.addColorStop(1,pal.low);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<5;i++){let x=((i*143-clouds*.35)%(W+130)+W+130)%(W+130)-60;cloud(x,65+(i%3)*76,.58+(i%2)*.2)}drawHills(pal)}
function drawHills(pal){const shift=clouds*.18;ctx.fillStyle=pal.far;ctx.beginPath();ctx.moveTo(0,H-54);for(let x=0;x<=W+8;x+=8){const y=H-155+Math.sin((x+shift)*Math.PI/170)*24+Math.sin((x+shift)*Math.PI/83)*10;ctx.lineTo(x,y)}ctx.lineTo(W,H-54);ctx.closePath();ctx.fill();ctx.fillStyle=pal.near;ctx.beginPath();ctx.moveTo(0,H-54);for(let x=0;x<=W+8;x+=8){const y=H-108+Math.sin((x-shift*1.8)*Math.PI/135)*30+Math.sin((x-shift)*Math.PI/72)*12;ctx.lineTo(x,y)}ctx.lineTo(W,H-54);ctx.closePath();ctx.fill()}
function drawPipes(){for(const p of pipes){const bottom=p.top+p.gap,x=p.x,w=62,capW=76,capH=25;const pipeGrad=ctx.createLinearGradient(x,0,x+w,0);pipeGrad.addColorStop(0,'#075b2b');pipeGrad.addColorStop(.14,'#15943c');pipeGrad.addColorStop(.34,'#57ed64');pipeGrad.addColorStop(.52,'#2dc94b');pipeGrad.addColorStop(.82,'#15913a');pipeGrad.addColorStop(1,'#064d25');const capGrad=ctx.createLinearGradient(x-7,0,x+capW-7,0);capGrad.addColorStop(0,'#075b2b');capGrad.addColorStop(.18,'#28c84d');capGrad.addColorStop(.42,'#70ff70');capGrad.addColorStop(.7,'#27bd45');capGrad.addColorStop(1,'#064d25');ctx.lineWidth=3;ctx.strokeStyle='#06431f';ctx.fillStyle=pipeGrad;ctx.fillRect(x,0,w,p.top);ctx.strokeRect(x+1,-2,w-2,p.top+2);ctx.fillRect(x,bottom,w,H-bottom-54);ctx.strokeRect(x+1,bottom,w-2,H-bottom-54);ctx.fillStyle=capGrad;ctx.fillRect(x-7,p.top-capH,capW,capH);ctx.strokeRect(x-7,p.top-capH,capW,capH);ctx.fillRect(x-7,bottom,capW,capH);ctx.strokeRect(x-7,bottom,capW,capH);ctx.fillStyle='#a0ff89';ctx.fillRect(x-4,p.top-capH+3,capW-6,4);ctx.fillRect(x-4,bottom+3,capW-6,4);ctx.fillStyle='#064c25';ctx.fillRect(x+8,0,5,Math.max(0,p.top-capH));ctx.fillRect(x+8,bottom+capH,5,Math.max(0,H-bottom-capH-54));ctx.fillStyle='#ffffff24';ctx.fillRect(x+20,0,4,Math.max(0,p.top-capH));ctx.fillRect(x+20,bottom+capH,4,Math.max(0,H-bottom-capH-54))}}
function drawGround(){let y=H-54;ctx.fillStyle='#d5a14c';ctx.fillRect(0,y,W,54);ctx.fillStyle='#80502d';ctx.fillRect(0,y+19,W,35);ctx.fillStyle='#54d34e';ctx.fillRect(0,y,W,15);ctx.fillStyle='#b4ff6c';for(let x=-(ground%32);x<W;x+=32)ctx.fillRect(x,y+2,17,4);ctx.fillStyle='#f9d68a';for(let x=-(ground%28);x<W;x+=28)ctx.fillRect(x,y+24,13,5)}
function drawBird(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-.45,Math.min(.9,bird.rot)));
// Tail feathers
ctx.fillStyle='#e99b25';ctx.strokeStyle='#a65b1c';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-14,1);ctx.lineTo(-27,-7);ctx.lineTo(-24,3);ctx.lineTo(-29,9);ctx.lineTo(-13,9);ctx.closePath();ctx.fill();ctx.stroke();
// Body and feather shading
const body=ctx.createRadialGradient(-5,-7,2,0,0,23);body.addColorStop(0,'#fff078');body.addColorStop(.62,'#f8c936');body.addColorStop(1,'#e69a1d');ctx.fillStyle=body;ctx.strokeStyle='#a65b1c';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,19,15,0,0,Math.PI*2);ctx.fill();ctx.stroke();
// Wing with feather lines
ctx.fillStyle='#eaa126';ctx.beginPath();ctx.ellipse(-5,5,10,7,Math.sin(frame*.3)*.38,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#bd741b';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-11,4);ctx.quadraticCurveTo(-4,2,1,7);ctx.moveTo(-9,8);ctx.quadraticCurveTo(-3,6,1,10);ctx.stroke();
// Eye and eyebrow
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(8,-7,6.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#a65b1c';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#17233c';ctx.beginPath();ctx.arc(10,-7,2.8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(10.8,-8,1,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#8a4d19';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(3,-14);ctx.lineTo(12,-14);ctx.stroke();
// Orange beak
ctx.fillStyle='#ff8a24';ctx.strokeStyle='#a94d13';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(30,4);ctx.lineTo(15,10);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(16,5);ctx.lineTo(27,5);ctx.stroke();
// Small rolled joint held in the beak, with a glowing tip
ctx.save();ctx.translate(25,5);ctx.rotate(.16);ctx.fillStyle='#f5e7bd';ctx.strokeStyle='#85684c';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(0,-2.5,17,5,2);ctx.fill();ctx.stroke();ctx.fillStyle='#b9a17c';ctx.fillRect(1,-1.5,3,3);ctx.fillStyle='#d9d1bd';ctx.fillRect(5,-1.5,9,3);ctx.fillStyle='#f05a28';ctx.beginPath();ctx.arc(17,0,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd36a';ctx.beginPath();ctx.arc(17,0,1,0,Math.PI*2);ctx.fill();
// tiny curling smoke
ctx.strokeStyle='#f4f5edcc';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(17,-3);ctx.quadraticCurveTo(13,-8,17,-11);ctx.quadraticCurveTo(21,-14,17,-18);ctx.stroke();ctx.restore();
ctx.restore()}
function overlay(a,b){ctx.fillStyle='#05142d66';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 31px Arial';ctx.shadowColor='#16335c';ctx.shadowBlur=5;ctx.fillText(a,W/2,H*.43);ctx.shadowBlur=0;ctx.font='bold 16px Arial';ctx.fillText(b,W/2,H*.43+31)}
function draw(){background();drawPipes();drawGround();drawBird();ctx.textAlign='center';ctx.font='900 42px Arial';ctx.lineWidth=4;ctx.strokeStyle='#1c542e';ctx.strokeText(String(score),W/2,58);ctx.fillStyle='#fff';ctx.fillText(String(score),W/2,58);if(!playing)overlay(ready?'SKY HOPPER':'GAME OVER',ready?'Tap, click, or press SPACE to flap':'Score '+score+' · Tap to try again')}
function finish(){playing=false;ready=false;$('start').textContent='PLAY AGAIN';if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem(key,String(best))}catch(e){}}draw();overlay('GAME OVER','Score '+score+' · Tap or press SPACE to retry')}
function loop(){if(!playing)return;frame++;modeElapsed++;if(modeElapsed>=25*60){backgroundMode=1-backgroundMode;modeElapsed=0}bird.vy+=.27;bird.y+=bird.vy;bird.rot=Math.min(1,bird.vy*.08);clouds+=.45;ground+=3.6;if(frame%78===1)addPipe();for(const p of pipes){p.x-=3.6;if(!p.passed&&p.x+62<bird.x){p.passed=true;score++;$('score').textContent=score;if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem(key,String(best))}catch(e){}}}if(bird.x+bird.r>p.x-4&&bird.x-bird.r<p.x+68&&(bird.y-bird.r<p.top||bird.y+bird.r>p.top+p.gap)){finish();return}}pipes=pipes.filter(p=>p.x>-90);if(bird.y-bird.r<0||bird.y+bird.r>H-54){finish();return}draw();raf=requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{e.preventDefault();flap()});$('start').addEventListener('click',flap);$('restart').addEventListener('click',start);window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(!e.repeat)flap()}});reset();
})();
</script></body></html>
