
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meteor Tap | MattBread Arcade</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px 12px;background:#080914;color:#f4f6ff;font-family:Arial,sans-serif;text-align:center}
h1{color:#ff6b35;font-size:clamp(30px,6vw,46px);text-shadow:0 0 18px #ff451b88;margin:8px 0}
p{color:#bbc4dd}
.wrap{max-width:620px;margin:auto}
.stats{display:flex;gap:8px;margin:18px 0}
.stat{flex:1;background:#151729;border:1px solid #39314b;border-radius:12px;padding:12px 5px}
.stat small{display:block;color:#b6bdd3;margin-bottom:6px}
.stat strong{font-size:clamp(19px,4vw,26px);color:#ff9b61}
canvas{display:block;width:100%;height:auto;border:2px solid #ff6b35;border-radius:12px;background:#090b1a;touch-action:manipulation;cursor:crosshair;box-shadow:0 0 24px #ff572230}
button{margin:12px 5px 4px;padding:12px 20px;border:0;border-radius:10px;background:#ff6b35;color:#170803;font-weight:bold;font-size:16px;cursor:pointer}
button:hover{filter:brightness(1.15)}
#message{min-height:24px;color:#ffd0a8;font-weight:bold}
a{display:inline-block;margin-top:14px;color:#ff9b61;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<h1>☄️ METEOR TAP</h1>
<p>Tap the falling meteors before they hit the ground!</p>
<div class="stats">
<div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
<div class="stat"><small>BEST</small><strong id="best">0</strong></div>
<div class="stat"><small>SHIELDS</small><strong id="lives">3</strong></div>
</div>
<canvas id="game" width="600" height="600" aria-label="Tap falling meteors to destroy them"></canvas>
<p id="message">Press Start, then tap or click the meteors!</p>
<button id="start">▶ Start / Restart</button>
<p>Every meteor destroyed earns 10 points. Miss three meteors and the game ends!</p>
<a href="index.html">← Back to Mini Pack 01</a>
</div>
<script>
(()=>{
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');
const livesEl=document.getElementById('lives');
const message=document.getElementById('message');
const startBtn=document.getElementById('start');
let score=0,lives=3,best=0,meteors=[],particles=[];
let playing=false,over=false,last=0,spawn=0,raf=0;
try{best=Number(localStorage.getItem('meteorTapBest'))||0}catch(e){}
bestEl.textContent=best;
const stars=Array.from({length:75},()=>({x:Math.random()*600,y:Math.random()*600,r:Math.random()*1.5+.4}));
function reset(){
cancelAnimationFrame(raf);
score=0;lives=3;meteors=[];particles=[];spawn=0;last=0;
playing=true;over=false;
scoreEl.textContent=score;livesEl.textContent=lives;
message.textContent='Meteor shower incoming!';
raf=requestAnimationFrame(frame);
}
function makeMeteor(){
const r=17+Math.random()*15;
meteors.push({x:r+Math.random()*(600-r*2),y:-r,r,speed:105+Math.random()*65+score*1.5,spin:Math.random()*6.28,rot:(Math.random()-.5)*2});
}
function burst(x,y){
for(let i=0;i<12;i++){
const a=Math.random()*Math.PI*2,s=50+Math.random()*180;
particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45+Math.random()*.4,max:.85});
}
}
function update(dt){
spawn+=dt;
const interval=Math.max(.28,1.0-score/500);
if(spawn>interval){spawn=0;makeMeteor()}
for(const m of meteors){m.y+=m.speed*dt;m.spin+=m.rot*dt}
for(let i=meteors.length-1;i>=0;i--){
if(meteors[i].y-meteors[i].r>600){
meteors.splice(i,1);lives--;livesEl.textContent=lives;
if(lives<=0){endGame();return}
message.textContent='A meteor got through! Watch the sky!';
}}
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
if(p.life<=0)particles.splice(i,1);
}
}
function draw(){
ctx.clearRect(0,0,600,600);
const g=ctx.createLinearGradient(0,0,0,600);
g.addColorStop(0,'#10152e');g.addColorStop(1,'#1b1022');
ctx.fillStyle=g;ctx.fillRect(0,0,600,600);
ctx.fillStyle='#c5d8ff';
for(const s of stars){ctx.globalAlpha=.4+(Math.sin(performance.now()/500+s.x)*.25+.25);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
ctx.globalAlpha=1;
ctx.fillStyle='#452339';ctx.fillRect(0,560,600,40);
ctx.fillStyle='#ff6b35';ctx.fillRect(0,560,600,3);
ctx.shadowColor='#ff6b35';ctx.shadowBlur=15;
for(const m of meteors){
ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.spin);
ctx.fillStyle='#b7472e';ctx.strokeStyle='#ffb06c';ctx.lineWidth=2;
ctx.beginPath();
for(let i=0;i<9;i++){const a=i*Math.PI*2/9,r=m.r*(i%2?.82:1);const x=Math.cos(a)*r,y=Math.sin(a)*r;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
ctx.closePath();ctx.fill();ctx.stroke();
ctx.shadowBlur=0;ctx.fillStyle='#ffb66b';
ctx.beginPath();ctx.arc(-m.r*.2,-m.r*.15,m.r*.24,0,Math.PI*2);ctx.fill();
ctx.restore();
}
ctx.shadowBlur=0;
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle='#ffbd69';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}
ctx.globalAlpha=1;
if(!playing){
ctx.fillStyle='#050714cc';ctx.fillRect(55,235,490,115);
ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 32px Arial';
ctx.fillText(over?'SHOWER OVER':'READY, DEFENDER?',300,280);
ctx.font='18px Arial';ctx.fillStyle='#ffb17c';
ctx.fillText(over?'Final score: '+score:'Press Start to begin',300,320);
}
}
function frame(now){
if(!playing)return;
const dt=last?Math.min((now-last)/1000,.04):0;last=now;
update(dt);draw();
if(playing)raf=requestAnimationFrame(frame);
}
function endGame(){
playing=false;over=true;cancelAnimationFrame(raf);
message.textContent='Game over! You scored '+score+'. Restart to defend the planet again.';
draw();
}
function tap(e){
if(!playing)return;
const rect=canvas.getBoundingClientRect();
const x=(e.clientX-rect.left)*600/rect.width;
const y=(e.clientY-rect.top)*600/rect.height;
for(let i=meteors.length-1;i>=0;i--){
const m=meteors[i];
if(Math.hypot(x-m.x,y-m.y)<m.r+10){
burst(m.x,m.y);meteors.splice(i,1);
score+=10;scoreEl.textContent=score;
if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('meteorTapBest',String(best))}catch(e){}}
message.textContent='Direct hit! Keep going!';
return;
}}
}
canvas.addEventListener('pointerdown',tap);
startBtn.addEventListener('click',reset);
draw();
})();
</script>
</body>
</html>
