
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paddle Blitz | MattBread Arcade</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d19;color:#f5f7ff;font-family:Arial,sans-serif;text-align:center;padding:20px}
h1{color:#ff3155;text-shadow:0 0 18px #ff315577}
p{color:#b9c5df}
.game{max-width:760px;margin:auto}
canvas{width:100%;max-width:700px;background:#101a30;border:2px solid #35c9ff;border-radius:12px;display:block;margin:18px auto;touch-action:none}
button{background:#ff3155;color:white;border:0;border-radius:8px;padding:12px 20px;font-weight:bold;cursor:pointer}
.stats{display:flex;justify-content:center;gap:28px;font-size:1.1rem}
a{color:#35c9ff}
</style>
</head>
<body>
<div class="game">
<h1>⚡ PADDLE BLITZ</h1>
<p>Keep the ball alive! Move with ← → or A / D, or move your mouse over the game.</p>
<div class="stats">
<div>Score: <strong id="score">0</strong></div>
<div>Lives: <strong id="lives">3</strong></div>
</div>
<canvas id="game" width="700" height="450" aria-label="Paddle Blitz game area"></canvas>
<button id="restart">Restart Game</button>
<p id="message">Press a movement key or move your mouse to start!</p>
<p><a href="index.html">← Back to Mini Pack 01</a></p>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const livesEl=document.getElementById("lives");
const message=document.getElementById("message");
const keys={};
let paddle,ball,score,lives,running,started,raf;

function reset(){
  cancelAnimationFrame(raf);
  paddle={x:300,y:415,w:100,h:14,speed:7};
  ball={x:350,y:300,r:9,vx:3.5,vy:-4};
  score=0;lives=3;running=true;started=false;
  scoreEl.textContent=score;livesEl.textContent=lives;
  message.textContent="Press a movement key or move your mouse to start!";
  draw();
}
function start(){if(!started&&running){started=true;message.textContent="Keep the ball in play!";loop();}}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#101a30";ctx.fillRect(0,0,700,450);
  ctx.strokeStyle="#233653";ctx.lineWidth=1;
  for(let x=20;x<700;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,450);ctx.stroke();}
  for(let y=20;y<450;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(700,y);ctx.stroke();}
  ctx.fillStyle="#35c9ff";ctx.shadowColor="#35c9ff";ctx.shadowBlur=15;
  ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
  ctx.shadowColor="#ff3155";ctx.fillStyle="#ff3155";
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#f5f7ff";ctx.font="14px Arial";
  ctx.fillText("PADDLE BLITZ",18,25);
}
function loop(){
  if(!running||!started)return;
  if(keys.ArrowLeft||keys.a||keys.A)paddle.x-=paddle.speed;
  if(keys.ArrowRight||keys.d||keys.D)paddle.x+=paddle.speed;
  paddle.x=Math.max(0,Math.min(700-paddle.w,paddle.x));
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x-ball.r<0||ball.x+ball.r>700)ball.vx*=-1;
  if(ball.y-ball.r<0)ball.vy=Math.abs(ball.vy);
  if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){
    ball.vy=-Math.abs(ball.vy);
    ball.vx=((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2))*5;
    score++;scoreEl.textContent=score;
  }
  if(ball.y-ball.r>450){
    lives--;livesEl.textContent=lives;
    if(lives<=0){running=false;message.textContent="Game over! Final score: "+score+". Press Restart Game to play again.";draw();return;}
    ball={x:350,y:300,r:9,vx:(Math.random()<.5?-1:1)*3.5,vy:-4};
  }
  draw();raf=requestAnimationFrame(loop);
}
document.addEventListener("keydown",e=>{
  keys[e.key]=true;
  if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
  if(["ArrowLeft","ArrowRight","a","A","d","D"].includes(e.key))start();
});
document.addEventListener("keyup",e=>keys[e.key]=false);
canvas.addEventListener("mousemove",e=>{
  const rect=canvas.getBoundingClientRect();
  paddle.x=((e.clientX-rect.left)/rect.width)*700-paddle.w/2;
  paddle.x=Math.max(0,Math.min(700-paddle.w,paddle.x));start();
});
canvas.addEventListener("touchmove",e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  paddle.x=((e.touches[0].clientX-rect.left)/rect.width)*700-paddle.w/2;
  paddle.x=Math.max(0,Math.min(700-paddle.w,paddle.x));start();
},{passive:false});
document.getElementById("restart").addEventListener("click",reset);
reset();
</script>
</body>
</html>
