
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Target Pop | MattBread Arcade</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px 12px;background:#090b16;color:#f5f7ff;font-family:Arial,sans-serif;text-align:center}
.wrap{max-width:650px;margin:auto}
h1{font-size:clamp(32px,6vw,48px);color:#ff386d;text-shadow:0 0 18px #ff386d80;margin:8px 0}
p{color:#bdc6df}
.stats{display:flex;gap:8px;margin:18px 0}
.stat{flex:1;background:#151a2b;border:1px solid #343b55;border-radius:12px;padding:12px 4px}
.stat small{display:block;color:#aab5d0;margin-bottom:5px}
.stat strong{font-size:clamp(20px,4vw,27px);color:#00f5ff}
canvas{display:block;width:100%;height:auto;border:2px solid #ff386d;border-radius:12px;background:#10172b;touch-action:manipulation;cursor:crosshair}
button{margin:12px 5px;padding:12px 20px;border:0;border-radius:10px;background:#ff386d;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.15)}
#message{min-height:24px;color:#ff9cb5;font-weight:bold}
a{display:inline-block;margin-top:14px;color:#00f5ff;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<h1>🎯 TARGET POP</h1>
<p>Hit as many moving targets as you can before time runs out!</p>
<div class="stats">
<div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
<div class="stat"><small>TIME</small><strong id="time">30</strong></div>
<div class="stat"><small>HITS</small><strong id="hits">0</strong></div>
</div>
<canvas id="board" width="600" height="500" aria-label="Click the moving targets"></canvas>
<p id="message">Press Start, then click or tap the targets!</p>
<button id="start">▶ Start / Restart</button>
<p>Each hit earns 10 points. Targets move faster as your score increases.</p>
<a href="index.html">← Back to Mini Pack 01</a>
</div>
<script>
(()=>{
const canvas=document.getElementById('board');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const hitsEl=document.getElementById('hits');
const message=document.getElementById('message');
const startBtn=document.getElementById('start');
let score=0,hits=0,time=30,target=null;
let playing=false,last=0,raf=0,remaining=30,best=0;
try{best=Number(localStorage.getItem('targetPopBest'))||0}catch(e){}
function newTarget(){
const r=20+Math.random()*8;
target={x:r+Math.random()*(600-r*2),y:r+Math.random()*(500-r*2),r,
vx:(Math.random()<.5?-1:1)*(100+score*1.3),
vy:(Math.random()<.5?-1:1)*(80+score*.9),
pulse:0};
}
function reset(){
cancelAnimationFrame(raf);
score=0;hits=0;time=30;remaining=30;last=0;playing=true;
scoreEl.textContent='0';hitsEl.textContent='0';timeEl.textContent='30';
message.textContent='Go! Hit those targets!';
newTarget();raf=requestAnimationFrame(loop);
}
function update(dt){
remaining-=dt;time=Math.max(0,Math.ceil(remaining));
timeEl.textContent=time;
if(remaining<=0){finish();return}
target.x+=target.vx*dt;target.y+=target.vy*dt;target.pulse+=dt*6;
if(target.x<target.r||target.x>600-target.r)target.vx*=-1;
if(target.y<target.r||target.y>500-target.r)target.vy*=-1;
}
function draw(){
ctx.clearRect(0,0,600,500);
const g=ctx.createLinearGradient(0,0,600,500);
g.addColorStop(0,'#111a35');g.addColorStop(1,'#1b1028');
ctx.fillStyle=g;ctx.fillRect(0,0,600,500);
ctx.strokeStyle='#263653';ctx.lineWidth=1;
for(let x=0;x<=600;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,500);ctx.stroke()}
for(let y=0;y<=500;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(600,y);ctx.stroke()}
if(target&&playing){
const r=target.r+Math.sin(target.pulse)*2;
ctx.save();ctx.translate(target.x,target.y);
ctx.shadowColor='#ff386d';ctx.shadowBlur=24;
ctx.fillStyle='#ff386d';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,r*.69,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#00dce8';ctx.beginPath();ctx.arc(0,0,r*.39,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,r*.13,0,Math.PI*2);ctx.fill();
ctx.restore();
}
if(!playing){
ctx.fillStyle='#050817d9';ctx.fillRect(55,185,490,130);
ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 32px Arial';
ctx.fillText(remaining<=0?'TIME UP!':'READY, AIM, POP!',300,230);
ctx.font='19px Arial';ctx.fillStyle='#00f5ff';
ctx.fillText(remaining<=0?'Final score: '+score:'Press Start to begin',300,270);
ctx.font='15px Arial';ctx.fillStyle='#c4cce0';
ctx.fillText('Best score: '+best,300,295);
}
}
function loop(now){
if(!playing)return;
const dt=last?Math.min((now-last)/1000,.04):0;last=now;
update(dt);draw();
if(playing)raf=requestAnimationFrame(loop);
}
function finish(){
playing=false;remaining=0;timeEl.textContent='0';
if(score>best){best=score;try{localStorage.setItem('targetPopBest',String(best))}catch(e){}}
message.textContent='Time is up! You hit '+hits+' targets for '+score+' points. Play again!';
draw();
}
canvas.addEventListener('pointerdown',e=>{
if(!playing||!target)return;
const rect=canvas.getBoundingClientRect();
const x=(e.clientX-rect.left)*600/rect.width;
const y=(e.clientY-rect.top)*500/rect.height;
if(Math.hypot(x-target.x,y-target.y)<=target.r+5){
score+=10;hits++;
scoreEl.textContent=score;hitsEl.textContent=hits;
message.textContent='Bullseye! +10 points!';
newTarget();
}else message.textContent='Miss! Keep your eyes on the target.';
});
startBtn.addEventListener('click',reset);
draw();
})();
</script>
</body>
</html>
