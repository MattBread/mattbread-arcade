
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frogger | MattBread Arcade</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071321;color:#efffff;font-family:Arial,sans-serif;text-align:center;padding:16px}
h1{color:#55ff80;font-size:42px;margin:8px;text-shadow:0 0 15px #36ff8070}
.stats{display:flex;justify-content:center;gap:10px;margin:15px auto}
.stat{background:#142b40;border:1px solid #35f5ff;border-radius:10px;padding:10px 18px}
.stat strong{display:block;color:#35f5ff;font-size:24px}
.stat span{font-size:11px;color:#bdd3e5}
main{max-width:500px;margin:auto}
canvas{display:block;width:100%;height:auto;border:2px solid #35f5ff;border-radius:8px;background:#153b38;touch-action:manipulation}
button,.back{background:#163c51;color:white;border:1px solid #35f5ff;border-radius:9px;padding:12px 16px;font-weight:bold;cursor:pointer;margin:5px}
.controls{display:grid;grid-template-columns:repeat(3,58px);gap:5px;justify-content:center;margin:12px}
.controls button{font-size:22px;margin:0;padding:8px}
.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
#message{min-height:22px;color:#b9d7e9;margin:10px}
a{display:inline-block;text-decoration:none;margin-top:12px}
</style>
</head>
<body>
<h1>FROGGER</h1>
<main>
<div class="stats">
<div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
<div class="stat"><span>BEST</span><strong id="best">0</strong></div>
<div class="stat"><span>LIVES</span><strong id="lives">3</strong></div>
</div>
<canvas id="game" width="480" height="600"></canvas>
<div id="message">Hop across the roads and river to reach home!</div>
<button id="start">▶ START GAME</button>
<button id="pause">Ⅱ PAUSE</button>
<button id="restart">↻ RESTART</button>
<div class="controls">
<button class="up" data-move="0,-1">▲</button>
<button class="left" data-move="-1,0">◀</button>
<button class="down" data-move="0,1">▼</button>
<button class="right" data-move="1,0">▶</button>
</div>
<p>Arrow keys or WASD to move. Reach all five home pads!</p>
<a class="back" href="../../">← BACK TO MATTBREAD ARCADE</a>
</main>
<script>
(function(){
"use strict";
var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var scoreEl=document.getElementById("score");
var bestEl=document.getElementById("best");
var livesEl=document.getElementById("lives");
var msg=document.getElementById("message");
var CELL=40,W=480,H=600;
var score=0,lives=3,level=1,best=0,running=false,paused=false,over=false;
var frog={x:5,y:14},homes=[false,false,false,false,false];
var objects=[],last=0,elapsed=0,invincible=0;
try{best=Number(localStorage.getItem("mbFroggerBest"))||0}catch(e){}
bestEl.textContent=best;

var lanes=[
{row:1,type:"log",speed:48,width:115,color:"#bd8446"},
{row:2,type:"log",speed:-62,width:150,color:"#d29b55"},
{row:3,type:"log",speed:40,width:100,color:"#a96d3b"},
{row:4,type:"log",speed:-52,width:115,color:"#d39a50"},
{row:6,type:"car",speed:105,width:54,color:"#ff515e"},
{row:7,type:"car",speed:-135,width:68,color:"#48cfff"},
{row:8,type:"car",speed:85,width:47,color:"#ffd34f"},
{row:9,type:"car",speed:-110,width:60,color:"#c28aff"},
{row:10,type:"car",speed:95,width:52,color:"#ff9254"}
];

function createObjects(){
 objects=[];
 lanes.forEach(function(l){
  var count=l.type==="log"?3:4;
  for(var i=0;i<count;i++){
   objects.push({row:l.row,type:l.type,x:i*(W/count),w:l.width,
    speed:l.speed,color:l.color});
  }
 });
}
function updateStats(){
 scoreEl.textContent=score;
 livesEl.textContent=lives;
 if(score>best){best=score;try{localStorage.setItem("mbFroggerBest",best)}catch(e){}}
 bestEl.textContent=best;
}
function resetFrog(){frog={x:5,y:14};invincible=1.2}
function startGame(){
 score=0;lives=3;level=1;homes=[false,false,false,false,false];
 over=false;paused=false;running=true;elapsed=0;
 resetFrog();createObjects();updateStats();
 msg.textContent="Go! Dodge traffic and ride the logs!";
 document.getElementById("start").textContent="▶ RUNNING";
}
function loseLife(text){
 if(invincible>0||!running||paused||over)return;
 lives--;updateStats();msg.textContent=text;
 if(lives<=0){running=false;over=true;msg.textContent="GAME OVER! Press RESTART to play again."}
 else resetFrog();
}
function move(dx,dy){
 if(over)return;
 if(!running)startGame();
 if(paused)return;
 var nx=frog.x+dx,ny=frog.y+dy;
 if(nx<0||nx>=12||ny<0||ny>=15)return;
 frog.x=nx;frog.y=ny;
 if(dy<0){score+=10;updateStats()}
 if(frog.y===0){
  var idx=Math.floor(frog.x/2);
  if(idx<0||idx>4)return;
  if(homes[idx]){msg.textContent="That home is already filled!";resetFrog();return}
  homes[idx]=true;score+=100;updateStats();
  if(homes.every(Boolean)){
   score+=250;level++;homes=[false,false,false,false,false];createObjects();
   msg.textContent="LEVEL "+level+"! Everything moves faster!";
  }else msg.textContent="Home reached! Find another glowing pad!";
  resetFrog();
 }
}
function rect(x,y,w,h,color){
 ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
}
function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.lineTo(x+w,y+r);
 ctx.lineTo(x+w,y+h-r);ctx.lineTo(x+w-r,y+h);
 ctx.lineTo(x+r,y+h);ctx.lineTo(x,y+h-r);ctx.lineTo(x,y+r);
 ctx.closePath();ctx.fill();
}
function draw(){
 // Grass and safe start area
 rect(0,0,W,H,"#174936");
 rect(0,440,W,160,"#174d36");
 for(var i=0;i<75;i++){
  rect((i*67)%W,445+(i*31)%150,3,3,i%2?"#27774a":"#205c3c");
 }
 // Road
 for(var r=6;r<=10;r++){
  rect(0,r*CELL,W,CELL,r%2?"#303944":"#27323d");
  for(var d=0;d<6;d++)rect(d*88+10,r*CELL+19,38,2,"#75808b");
 }
 // River and ripples
 rect(0,CELL,W,160,"#0875a5");
 for(var q=0;q<30;q++){
  rect((q*79+elapsed*24)%W,CELL+(q*43)%155,18,2,"#36a7c9");
 }
 // Green median
 rect(0,200,W,40,"#267347");
 for(var g=0;g<22;g++)rect(g*23+5,215+(g%3)*4,4,4,"#61b86b");
 // Home row and pads
 rect(0,0,W,40,"#155b3a");
 for(var h=0;h<5;h++){
  rounded(h*96+5,5,86,30,7,homes[h]?"#c3ff70":"#092b32");
  ctx.fillStyle=homes[h]?"#164526":"#6dffc1";
  ctx.font="bold 22px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(homes[h]?"✓":"✦",h*96+48,20);
 }
 // Objects: logs and vehicles
 objects.forEach(function(o){
  var y=o.row*CELL+7;
  if(o.type==="log"){
   rounded(o.x,y,o.w,25,6,o.color);
   for(var a=o.x+10;a<o.x+o.w-5;a+=19)rect(a,y+5,3,15,"#80512f");
   rect(o.x+5,y+3,o.w-10,2,"#e5bb79");
  }else{
   rounded(o.x,y,o.w,25,6,o.color);
   rect(o.x+o.w*.2,y+3,o.w*.25,7,"#e6f8ff");
   rect(o.x+o.w*.58,y+3,o.w*.25,7,"#e6f8ff");
   rect(o.x+7,y+21,10,5,"#111923");
   rect(o.x+o.w-17,y+21,10,5,"#111923");
  }
 });
 // Frog character
 if(invincible<=0||Math.floor(elapsed*12)%2===0){
  var fx=frog.x*CELL+20,fy=frog.y*CELL+21;
  ctx.fillStyle="#43f56b";
  ctx.beginPath();ctx.ellipse(fx,fy,14,13,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(fx-8,fy-9,7,0,Math.PI*2);
  ctx.arc(fx+8,fy-9,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(fx-8,fy-10,4,0,Math.PI*2);
  ctx.arc(fx+8,fy-10,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#10231c";
  ctx.beginPath();ctx.arc(fx-7,fy-10,2,0,Math.PI*2);
  ctx.arc(fx+9,fy-10,2,0,Math.PI*2);ctx.fill();
  rect(fx-10,fy+8,7,5,"#43f56b");rect(fx+4,fy+8,7,5,"#43f56b");
 }
 if(!running&&!over){
  rect(0,0,W,H,"#06111bc9");
  ctx.fillStyle="#66ff91";ctx.font="bold 35px Arial";ctx.textAlign="center";
  ctx.fillText("FROGGER",W/2,H/2-20);
  ctx.fillStyle="white";ctx.font="16px Arial";
  ctx.fillText("Press START to play",W/2,H/2+18);
 }
 if(paused){
  rect(0,0,W,H,"#06111bd9");
  ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 34px Arial";
  ctx.fillText("PAUSED",W/2,H/2);
 }
 if(over){
  rect(0,0,W,H,"#06111bd9");
  ctx.fillStyle="#ff7777";ctx.textAlign="center";ctx.font="bold 32px Arial";
  ctx.fillText("GAME OVER",W/2,H/2-15);
  ctx.fillStyle="white";ctx.font="16px Arial";
  ctx.fillText("Score: "+score,W/2,H/2+20);
 }
}
function update(dt){
 if(!running||paused||over)return;
 elapsed+=dt;if(invincible>0)invincible-=dt;
 objects.forEach(function(o){
  o.x+=o.speed*(1+(level-1)*.12)*dt;
  if(o.speed>0&&o.x>W+o.w)o.x=-o.w;
  if(o.speed<0&&o.x<-o.w)o.x=W+o.w;
 });
 if(frog.y>=1&&frog.y<=4){
  var fx=frog.x*CELL+5;
  var platform=objects.find(function(o){
   return o.type==="log"&&o.row===frog.y&&fx<o.x+o.w&&fx+30>o.x;
  });
  if(!platform)loseLife("Splash! You fell into the river!");
  else{
   frog.x+=platform.speed*dt/CELL;
   if(frog.x<0||frog.x>=12)loseLife("The current swept you away!");
  }
 }else if(frog.y>=6&&frog.y<=10&&invincible<=0){
  var hit=objects.some(function(o){
   return o.type==="car"&&o.row===frog.y&&frog.x*CELL+7<o.x+o.w&&frog.x*CELL+33>o.x;
  });
  if(hit)loseLife("A vehicle hit you! Watch the road!");
 }
}
function frame(t){
 var dt=Math.min((t-last)/1000||0,.04);last=t;
 try{update(dt);draw()}catch(e){
  msg.textContent="Game error: "+e.message;
  console.error(e);
 }
 requestAnimationFrame(frame);
}
document.addEventListener("keydown",function(e){
 var k=e.key.toLowerCase(),d=null;
 if(k==="arrowup"||k==="w")d=[0,-1];
 if(k==="arrowdown"||k==="s")d=[0,1];
 if(k==="arrowleft"||k==="a")d=[-1,0];
 if(k==="arrowright"||k==="d")d=[1,0];
 if(d){e.preventDefault();if(!e.repeat)move(d[0],d[1])}
 if(k===" "||k==="p"){e.preventDefault();togglePause()}
 if(k==="enter"&&(!running||over))startGame();
});
document.querySelectorAll("[data-move]").forEach(function(b){
 b.addEventListener("pointerdown",function(e){
  e.preventDefault();var d=b.getAttribute("data-move").split(",");
  move(Number(d[0]),Number(d[1]));
 });
});
function togglePause(){
 if(!running||over)return;
 paused=!paused;
 document.getElementById("pause").textContent=paused?"▶ RESUME":"Ⅱ PAUSE";
 msg.textContent=paused?"Game paused.":"Back in action!";
}
document.getElementById("start").addEventListener("click",function(){if(!running||over)startGame()});
document.getElementById("restart").addEventListener("click",startGame);
document.getElementById("pause").addEventListener("click",togglePause);
createObjects();
draw();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
